<html>
<head>
    <title>Cafe Menu</title>
    <style>
        body {
            font-family: Arial;
            background-color: #fff8f0;
            margin: 0;
        }

        header {
            background-color: rgb(0, 174, 255);
            color: white;
            text-align: center;
            padding: 15px;
        }

        h2 {
            text-align: center;
            color: rgb(0, 174, 255);
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid rgb(0, 174, 255);
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(0, 174, 255)  ;
            color: white;
        }

        img {
            width: 100px;
            height: 80px;
        }

        footer {
            background-color: rgb(0, 174, 255);
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            table {
                width: 100%;
            }

            th, td {
                padding: 5px;
                font-size: 12px;
            }

            img {
                width: 60px;
                height: 50px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>The Mood Cafe</h1>
        <p>Fresh Coffee and Tasty Snacks</p>
    </header>

    <h2>Our Menu</h2>

    <table>
        <tr>
            <th>Image</th>
            <th>Item Name</th>
            <th>Price</th>
        </tr>

        <tr>
            <td><img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=200" alt="Coffee"></td>
            <td>Hot Coffee</td>
            <td>₹80</td>
        </tr>

        <tr>
            <td><img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=200" alt="Chocolate Cake"></td>
            <td>Chocolate Cake</td>
            <td>₹120</td>
        </tr>

        <tr>
            <td><img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=200" alt="Croissant"></td>
            <td>Croissant</td>
            <td>₹90</td>
        </tr>

        <tr>
            <td><img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=200" alt="Donut"></td>
            <td>Chocolate Donut</td>
            <td>₹60</td>
        </tr>
    </table>

    <footer>
        <p>Thank you for visiting The Cozy Café!</p>
    </footer>

</body>
</html>
